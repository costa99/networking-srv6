# devstack local.conf for the networking-srv6 remote test machine.
#
# This is the reference config plugin.sh points at. If devstack is
# already stacked without the plugin, you don't need to restack --
# see remote-setup/README.rst for the hot-install path. Use this file
# for the next clean ./stack.sh.

[[local|localrc]]
# Adjust to the remote machine (Horizon currently at 192.168.0.157).
HOST_IP=192.168.0.157

ADMIN_PASSWORD=secret
DATABASE_PASSWORD=$ADMIN_PASSWORD
RABBIT_PASSWORD=$ADMIN_PASSWORD
SERVICE_PASSWORD=$ADMIN_PASSWORD

enable_plugin networking-srv6 https://github.com/costa99/networking-srv6 master

[[post-config|/$Q_PLUGIN_CONF_FILE]]
[ml2]
type_drivers = srv6,vxlan,geneve,vlan,flat,local
tenant_network_types = srv6

[ml2_type_srv6]
locator_pool = fc00:0:1::/48
locator_prefix_length = 64
